[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataclass-initializer"
version = "0.1.0"
description = "Build dataclass instances from configuration dictionaries or OmegaConf DictConfig."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "ry_yoshida" }
]
keywords = ["dataclass", "config", "omegaconf", "hydra", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "omegaconf>=2.0",
]

[project.urls]
Repository = "https://github.com/ry-yoshida/DataclassInitializer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataclass_initializer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
